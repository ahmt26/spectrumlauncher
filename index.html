<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönlendiriliyorsunuz...</title>
    <!-- Otomatik Yönlendirme Metası (3 saniye sonra hedef adrese yönlendirir) -->
    <!-- HEDEF_URL kısmını gitmek istediğiniz siteyle değiştirin -->
    <meta http-equiv="refresh" content="3; url=https://www.mediafire.com/file/xl94z6v5gflx7ts/RyzionMC_AFK_Client_Setup_1.1.1.exe/file">
    
    <!-- Modern Font Yükleme -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-gradient-start: #0f172a;
            --bg-gradient-end: #020617;
            --card-bg: rgba(30, 41, 59, 0.4);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-color: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            perspective: 1000px;
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3),
                        0 0 50px rgba(59, 130, 246, 0.05);
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeIn 0.8s ease-out;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4),
                        0 0 60px rgba(59, 130, 246, 0.1);
        }

        /* Yükleme Animasyonu */
        .loader-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 30px auto;
        }

        .loader-circle {
            width: 100%;
            height: 100%;
            border: 4px solid rgba(255, 255, 255, 0.05);
            border-left-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }

        .loader-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: var(--accent-color);
            animation: pulse 1.5s ease-in-out infinite;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 25px;
            font-weight: 300;
        }

        .btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--text-primary);
            color: var(--bg-gradient-end);
            border-color: var(--text-primary);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            transform: scale(1.02);
        }

        .countdown {
            font-weight: 600;
            color: var(--accent-color);
        }

        /* Animasyonlar */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.6;
                transform: translate(-50%, -50%) scale(0.95);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.05);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <!-- Görsel Yükleyici Bölümü -->
            <div class="loader-wrapper">
                <div class="loader-circle"></div>
                <div class="loader-icon">➜</div>
            </div>

            <h1>Yönlendiriliyorsunuz</h1>
            <p>
                Lütfen bekleyin, birkaç saniye içinde güvenli bağlantıya aktarılacaksınız.
                <br>
                Otomatik yönlendirme süresi: <span id="timer" class="countdown">3</span> saniye.
            </p>

            <!-- Manuel Yönlendirme Butonu (Yedek Plan) -->
            <!-- href kısmını gitmek istediğiniz siteyle değiştirin -->
            <a href="https://www.mediafire.com/file/xl94z6v5gflx7ts/RyzionMC_AFK_Client_Setup_1.1.1.exe/file" id="redirect-link" class="btn">Hemen Git</a>
        </div>
    </div>

    <script>
        // Hedef URL'yi buraya yazın
        const targetUrl = "https://www.mediafire.com/file/xl94z6v5gflx7ts/RyzionMC_AFK_Client_Setup_1.1.1.exe/file";
        
        // HTML elemanlarındaki linkleri güncelle
        document.getElementById('redirect-link').href = targetUrl;
        
        // Meta tag güncellemesi (JS devredışıysa meta tag çalışır, aktifse JS ile geri sayım yapılır)
        const metaTag = document.querySelector('meta[http-equiv="refresh"]');
        if (metaTag) {
            metaTag.setAttribute('content', `3; url=${targetUrl}`);
        }

        // Geri sayım sayacı
        let timeLeft = 3;
        const timerElement = document.getElementById('timer');
        
        const countdownInterval = setInterval(() => {
            timeLeft--;
            if (timerElement) {
                timerElement.textContent = timeLeft;
            }
            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                window.location.href = targetUrl;
            }
        }, 1000);
    </script>
</body>
</html>
